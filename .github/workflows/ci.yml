name: CI

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_URL: https://api.invalid/
  IMAGE_URL: https://images.invalid/
  API_TOKEN: ci-fake-token

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Spotless
        run: ./gradlew spotlessCheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintProdRelease

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7

  unit-test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Unit tests
        run: ./gradlew testMockDebugUnitTest

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: ./gradlew createMockDebugCoverageReport

      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/**'
          retention-days: 7

  instrumented-test:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Cache managed device images
        uses: actions/cache@v4
        with:
          path: ~/.android/gradle/avd
          key: gmd-${{ runner.os }}-${{ hashFiles('build-logic/convention/src/main/kotlin/com/yiwenliu/tmdb/GradleManagedDevices.kt') }}
          restore-keys: gmd-${{ runner.os }}-

      - name: app
        run: ./gradlew :app:ciGroupProdDebugAndroidTest

      - name: core:database
        if: ${{ !cancelled() }}
        run: ./gradlew :core:database:ciGroupProdDebugAndroidTest

      - name: feature:home
        if: ${{ !cancelled() }}
        run: ./gradlew :feature:home:impl:ciGroupProdDebugAndroidTest

      - name: feature:search
        if: ${{ !cancelled() }}
        run: ./gradlew :feature:search:impl:ciGroupProdDebugAndroidTest

      - name: feature:favorite
        if: ${{ !cancelled() }}
        run: ./gradlew :feature:favorite:impl:ciGroupProdDebugAndroidTest

      - name: feature:detail
        if: ${{ !cancelled() }}
        run: ./gradlew :feature:detail:impl:ciGroupProdDebugAndroidTest

      - name: Upload instrumented test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
