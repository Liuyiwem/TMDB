name: CD

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Signed prod release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      IMAGE_URL: ${{ secrets.IMAGE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Resolve version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Assemble signed prod release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleProdRelease

      - name: Verify the APK is actually signed
        run: |
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "using build-tools $BUILD_TOOLS"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose \
            app/build/outputs/apk/prod/release/app-prod-release.apk

      - name: Rename APK
        working-directory: app/build/outputs/apk/prod/release
        run: mv app-prod-release.apk "tmdb-$VERSION_NAME.apk"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/mapping/prodRelease/mapping.txt
          generate_release_notes: true

      - name: Upload APK artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: prod-release-apk
          path: |
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/mapping/prodRelease/mapping.txt
          retention-days: 7
